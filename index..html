<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Young Pro Homebase Finder</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#172033; --muted:#687386;
  --accent:#3b67f2; --accent2:#e9efff; --line:#dfe5ef; --good:#1f7a4d;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:22px; box-shadow:0 8px 30px rgba(21,34,66,.06); margin-bottom:18px;
}
.progress{height:10px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin:14px 0 4px}
.bar{height:100%;width:0;background:var(--accent);transition:.25s}
.chunk-title{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.q{margin:22px 0}
.q h2{font-size:21px;margin:0 0 12px}
.options{display:grid;gap:10px}
.option{
  display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;cursor:pointer;background:#fff;
}
.option:hover{border-color:#9db1f8;background:#fbfcff}
.option input{margin-top:3px;accent-color:var(--accent)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px}
button{
  border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:15px
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#edf0f6;color:var(--ink)}
.hidden{display:none}
.result{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.result h3{margin:0 0 4px;font-size:20px}
.badge{display:inline-block;background:var(--accent2);color:#2448b5;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:8px}
.reason{color:var(--muted);margin:6px 0 0}
.note{font-size:13px;color:var(--muted);margin-top:18px}
.score{font-weight:800;color:var(--good)}
.restart{margin-top:14px}
.small{font-size:14px;color:var(--muted)}
@media (max-width:600px){.card{padding:16px}.q h2{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Young Pro Homebase Finder</h1>
  <p class="sub">Tradeoffs only. No “it depends.” Assume a home budget around <strong>$250,000</strong>.</p>

  <div class="card">
    <div id="stepLabel" class="chunk-title"></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="form"></div>

    <div class="nav">
      <button id="backBtn" class="secondary" onclick="back()">Back</button>
      <button id="nextBtn" class="primary" onclick="next()">Next</button>
    </div>
  </div>

  <div id="results" class="card hidden"></div>
</div>

<script>
const chunks = [
  {
    title:"Chunk 1 · Big Picture",
    questions:[
      {id:"climate", text:"1. Climate", opts:[
        ["hot","Hot most of the year"],
        ["four","Four distinct seasons"],
        ["mild","Mild year-round"],
        ["cold","Cold / snowy is fine"]
      ]},
      {id:"size", text:"2. Metro size", opts:[
        ["huge","Huge city, 2M+ metro"],
        ["mid","Mid-size city, 500k–2M"],
        ["small","Small city, 100k–500k"],
        ["rural","Town / rural, under 100k"]
      ]},
      {id:"region", text:"3. Broad region", opts:[
        ["se","Southeast"],
        ["ne","Northeast / Mid-Atlantic"],
        ["mw","Midwest / Great Lakes"],
        ["mountain","Mountain West"],
        ["sw","Southwest"],
        ["pnw","Pacific Northwest"],
        ["any","I genuinely don’t care"]
      ]}
    ]
  },
  {
    title:"Chunk 2 · Lifestyle + Geography",
    questions:[
      {id:"outdoors", text:"4. What do you want nearby?", opts:[
        ["mountains","Mountains / trails"],
        ["water","Coast / large lake"],
        ["city","City amenities"],
        ["space","Space / land / quiet"]
      ]},
      {id:"drive", text:"5. Daily driving tolerance", opts:[
        ["low","I want most things within 10–15 minutes"],
        ["med","20–30 minutes is fine"],
        ["high","I’ll drive 45+ minutes for the right home"]
      ]}
    ]
  },
  {
    title:"Chunk 3 · Money + Housing",
    questions:[
      {id:"home", text:"6. Best $250k tradeoff", opts:[
        ["nice","Nice detached house in a less-famous area"],
        ["townhome","Townhouse / smaller home in a stronger metro"],
        ["fixer","Older fixer in a desirable area"],
        ["land","More land / privacy, fewer amenities"]
      ]},
      {id:"growth", text:"7. What matters more?", opts:[
        ["value","Low cost and financial breathing room"],
        ["balance","Balance of affordability + growth"],
        ["growth","Strong job market / growth, even if housing is tighter"]
      ]}
    ]
  },
  {
    title:"Chunk 4 · Culture",
    questions:[
      {id:"culture", text:"8. Social environment", opts:[
        ["traditional","More traditional / community-oriented"],
        ["mixed","A mix of viewpoints and lifestyles"],
        ["urban","More urban / cosmopolitan"]
      ]},
      {id:"pace", text:"9. Pace of life", opts:[
        ["slow","Slower and calmer"],
        ["medium","Active, but not chaotic"],
        ["fast","Fast, ambitious, always something happening"]
      ]},
      {id:"airport", text:"10. Airport access", opts:[
        ["major","Major airport within ~45 minutes"],
        ["regional","Regional airport is enough"],
        ["none","Not important"]
      ]}
    ]
  }
];

const places = [
  {
    name:"Upstate South Carolina", state:"South Carolina",
    region:"Greenville · Spartanburg · Anderson",
    tags:{climate:["hot","four"],size:["mid","small"],region:["se"],outdoors:["mountains"],drive:["med","high"],home:["nice","townhome"],growth:["balance","growth"],culture:["traditional","mixed"],pace:["medium"],airport:["regional","major"]},
    blurb:"Growing Southeast corridor with Blue Ridge access, smaller-city feel, and generally better housing value than major Sun Belt metros."
  },
  {
    name:"Piedmont Triad", state:"North Carolina",
    region:"Greensboro · Winston-Salem · High Point",
    tags:{climate:["hot","four"],size:["mid"],region:["se"],outdoors:["city","mountains"],drive:["low","med"],home:["nice","townhome"],growth:["value","balance"],culture:["mixed","traditional"],pace:["medium","slow"],airport:["regional"]},
    blurb:"A practical middle ground: moderate metro scale, decent access, established neighborhoods, and lower pressure than Charlotte or Raleigh."
  },
  {
    name:"Roanoke / New River Valley", state:"Virginia",
    region:"Roanoke · Salem · Blacksburg",
    tags:{climate:["four"],size:["small"],region:["se","ne"],outdoors:["mountains"],drive:["med","high"],home:["nice","land"],growth:["value","balance"],culture:["mixed","traditional"],pace:["slow"],airport:["regional"]},
    blurb:"Mountain scenery, smaller metros, college-town energy nearby, and a slower pace without going fully rural."
  },
  {
    name:"South-Central Pennsylvania", state:"Pennsylvania",
    region:"Harrisburg · York · Lancaster outskirts",
    tags:{climate:["four","cold"],size:["mid","small"],region:["ne"],outdoors:["city","space"],drive:["med"],home:["nice","fixer"],growth:["value","balance"],culture:["mixed","traditional"],pace:["medium"],airport:["regional"]},
    blurb:"Older housing stock, four seasons, access to several East Coast metros, and more attainable prices than the Northeast’s marquee cities."
  },
  {
    name:"Northeast Ohio", state:"Ohio",
    region:"Cleveland · Akron · Canton",
    tags:{climate:["four","cold"],size:["mid"],region:["mw"],outdoors:["water","city"],drive:["low","med"],home:["nice","fixer"],growth:["value","balance"],culture:["mixed"],pace:["medium"],airport:["major"]},
    blurb:"Large-metro amenities and Great Lakes access with unusually strong house-per-dollar value for a metro of its size."
  },
  {
    name:"Western Michigan", state:"Michigan",
    region:"Grand Rapids · Muskegon · Kalamazoo",
    tags:{climate:["four","cold"],size:["mid","small"],region:["mw"],outdoors:["water"],drive:["med"],home:["nice","townhome"],growth:["balance"],culture:["mixed","traditional"],pace:["medium"],airport:["regional"]},
    blurb:"Four seasons, freshwater access, a strong midsize-city lifestyle, and a good fit if winter is an acceptable tradeoff."
  },
  {
    name:"Central Indiana", state:"Indiana",
    region:"Indianapolis outskirts · Bloomington corridor",
    tags:{climate:["four"],size:["mid","small"],region:["mw"],outdoors:["city","space"],drive:["med"],home:["nice","land"],growth:["value","balance"],culture:["traditional","mixed"],pace:["medium"],airport:["major"]},
    blurb:"Central location, manageable metro growth, generally attainable housing, and easy access to a major airport."
  },
  {
    name:"Northwest Arkansas", state:"Arkansas",
    region:"Fayetteville · Bentonville · Rogers",
    tags:{climate:["hot","four"],size:["small","mid"],region:["se"],outdoors:["mountains"],drive:["med"],home:["townhome","nice"],growth:["growth","balance"],culture:["mixed","traditional"],pace:["medium"],airport:["regional"]},
    blurb:"Fast-growing economy, Ozark outdoor access, and a younger professional scene, though housing has become more competitive."
  },
  {
    name:"Tulsa Region", state:"Oklahoma",
    region:"Tulsa · Broken Arrow · Sand Springs",
    tags:{climate:["hot","four"],size:["mid"],region:["sw","mw"],outdoors:["city","space"],drive:["low","med"],home:["nice","land"],growth:["value","balance"],culture:["traditional","mixed"],pace:["medium"],airport:["regional"]},
    blurb:"Lower-cost urban living, roomier homes, and a manageable metro footprint with fewer housing-cost pressures than many growth markets."
  },
  {
    name:"Albuquerque / Central New Mexico", state:"New Mexico",
    region:"Albuquerque · Rio Rancho",
    tags:{climate:["mild","hot"],size:["mid"],region:["sw"],outdoors:["mountains"],drive:["med"],home:["townhome","fixer"],growth:["balance"],culture:["mixed","urban"],pace:["medium"],airport:["major"]},
    blurb:"Dry climate, mountain access, distinctive culture, and a midsize metro. Best for people who value sun and landscape over lush greenery."
  },
  {
    name:"Southern New Mexico", state:"New Mexico",
    region:"Las Cruces",
    tags:{climate:["hot","mild"],size:["small"],region:["sw"],outdoors:["mountains","space"],drive:["med","high"],home:["nice","land"],growth:["value"],culture:["mixed"],pace:["slow"],airport:["regional","none"]},
    blurb:"Sun, desert mountains, lower density, and generally more space, with the tradeoff of a smaller job market and fewer big-city amenities."
  },
  {
    name:"Eastern Washington", state:"Washington",
    region:"Spokane · Spokane Valley",
    tags:{climate:["four","cold"],size:["mid"],region:["pnw"],outdoors:["mountains","water"],drive:["med"],home:["townhome","fixer"],growth:["balance"],culture:["mixed"],pace:["medium"],airport:["regional"]},
    blurb:"A drier, sunnier alternative to western Washington with strong outdoor access and a more attainable scale than Seattle."
  },
  {
    name:"Southern Idaho", state:"Idaho",
    region:"Twin Falls · Idaho Falls",
    tags:{climate:["four","cold"],size:["small"],region:["mountain"],outdoors:["mountains","space"],drive:["high"],home:["nice","land"],growth:["balance"],culture:["traditional"],pace:["slow"],airport:["regional","none"]},
    blurb:"Outdoor access and lower density are the draw. The tradeoff is smaller-city life and less depth in the professional job market."
  },
  {
    name:"Western Kansas", state:"Kansas",
    region:"Wichita · Hutchinson",
    tags:{climate:["four","hot"],size:["mid","small"],region:["mw"],outdoors:["space"],drive:["med"],home:["nice","land"],growth:["value"],culture:["traditional"],pace:["slow"],airport:["regional"]},
    blurb:"Strong affordability and space, with a calmer pace. The tradeoff is fewer natural amenities and less big-city energy."
  }
];

let chunk = 0;
const answers = {};

function render(){
  document.getElementById("results").classList.add("hidden");
  document.querySelector(".card").classList.remove("hidden");

  const c = chunks[chunk];
  document.getElementById("stepLabel").textContent = c.title;
  document.getElementById("bar").style.width = ((chunk+1)/chunks.length*100) + "%";
  document.getElementById("backBtn").style.visibility = chunk===0 ? "hidden":"visible";
  document.getElementById("nextBtn").textContent = chunk===chunks.length-1 ? "See my matches":"Next";

  let out="";
  c.questions.forEach(q=>{
    out += `<div class="q"><h2>${q.text}</h2><div class="options">`;
    q.opts.forEach(([v,label])=>{
      const checked = answers[q.id]===v ? "checked":"";
      out += `<label class="option"><input type="radio" name="${q.id}" value="${v}" ${checked}><span>${label}</span></label>`;
    });
    out += `</div></div>`;
  });
  document.getElementById("form").innerHTML = out;
}

function collect(){
  const c = chunks[chunk];
  for(const q of c.questions){
    const el = document.querySelector(`input[name="${q.id}"]:checked`);
    if(!el) return false;
    answers[q.id] = el.value;
  }
  return true;
}

function next(){
  if(!collect()){
    alert("Pick one answer for each question in this chunk.");
    return;
  }
  if(chunk < chunks.length-1){ chunk++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}

function back(){
  if(chunk>0){ collect(); chunk--; render(); window.scrollTo({top:0,behavior:"smooth"}); }
}

function scorePlace(p){
  let score=0, max=0;
  for(const [key,val] of Object.entries(answers)){
    max++;
    if(p.tags[key] && p.tags[key].includes(val)) score++;
  }
  return {score,max,pct:Math.round((score/max)*100)};
}

function showResults(){
  const ranked = places.map(p=>({...p,...scorePlace(p)}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,5);

  document.querySelector(".card").classList.add("hidden");
  const box = document.getElementById("results");
  box.classList.remove("hidden");

  let out = `<div class="chunk-title">Your Results</div>
    <h2 style="font-size:28px;margin:8px 0 4px">Best-fit regions</h2>
    <p class="small">These are preference matches, not live real-estate or job-market guarantees.</p>`;

  ranked.forEach((r,i)=>{
    out += `<div class="result">
      <div class="badge">#${i+1} match · <span class="score">${r.pct}% fit</span></div>
      <h3>${r.name}</h3>
      <div><strong>${r.state}</strong> · ${r.region}</div>
      <p class="reason">${r.blurb}</p>
    </div>`;
  });

  out += `<p class="note"><strong>Important:</strong> Home prices can vary dramatically by neighborhood and change over time. Before buying, verify current listings, property taxes, insurance, HOA costs, and job options in your field.</p>
  <button class="secondary restart" onclick="restart()">Retake quiz</button>`;

  box.innerHTML = out;
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  Object.keys(answers).forEach(k=>delete answers[k]);
  chunk=0;
  document.querySelector(".card").classList.remove("hidden");
  render();
}

render();
</script>
</body>
</html>
